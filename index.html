<div class="ctl"><button class="btn" id="pv" aria-label="Previous project">${I.prev}</button><button class="btn" id="pp" aria-label="Auto-play projects">${I.play}</button><button class="btn" id="nx" aria-label="Next project">${I.next}</button></div></div></div>
<button class="tile act stat reveal" data-go="projects" style="--d:120ms"><div><span style="font-size:1.7rem;color:var(--ink)" data-count="${D.projects.length}">0</span><span>projects &middot; view</span></div></button>
<button class="tile act stat reveal" data-notice style="--d:160ms"><div><span style="font-size:1.7rem;color:var(--ink)" data-count="${parseInt(p.noticePeriod)}">0</span><span>days notice</span></div></button>
${D.experience.map((e,i)=>`<button class="tile act vbar r2 reveal" data-row="${i}" style="--d:${200+i*60}ms" aria-label="${esc(e.organization)}, ${esc(e.duration)}. Show in work profile"><div class="lab">${esc(e.organization.split(' ')[0])}</div><div class="fill" style="--c:${cols[i%2]};height:0" data-h="${Math.round(months(e.duration)/tot*100)}%">${months(e.duration)} mo</div></button>`).join('')}
<a class="tile act c2 place reveal" href="${mapUrl}" target="_blank" rel="noopener" style="--d:240ms"><div><b>${esc(p.location.split(',')[0])}</b><div class="sub">${esc(p.location.split(',').slice(1).join(',').trim())} &middot; open map</div></div></a>
<section class="tile c4 reveal" id="work"><h2>Work profile</h2>${D.experience.map((e,i)=>`<div class="row" data-r="${i}"><div><strong>${esc(e.organization)}</strong><span class="sub">${esc(e.role)} &middot; ${esc(e.duration)}</span></div>${chips(list(e.technologies))}</div>`).join('')}</section>
<section class="tile c4 reveal" id="skills"><h2>Technical proficiency</h2><p class="sub" style="margin:-6px 0 14px">Tap a skill to see which projects use it.</p><div class="tabs" role="tablist" aria-label="Skill groups">${['All',...Object.keys(sg)].map((c,n)=>`<button role="tab" data-tab="${esc(c)}" aria-selected="${n===0}" class="${n===0?'on':''}">${esc(c)}</button>`).join('')}</div><div id="sk"></div></section>
<section class="tile c2 reveal" id="more"><h2>Awards and achievements</h2><ul class="plain">${D.awards.map(a=>`<li>${esc(a.title)}</li>`).join('')}</ul></section>
<section class="tile c2 reveal"><h2>Interests</h2><ul class="plain">${D.interests.map(a=>`<li>${esc(a.interest)}</li>`).join('')}</ul><h2 style="margin-top:22px">Languages</h2><ul class="plain">${D.languages.map(l=>`<li><strong>${esc(l.language)}</strong> <span class="small">${ab(l)}</span></li>`).join('')}</ul></section>
</div></div>
<div class="dock"><div class="pill" aria-label="Skills"><b>Skills</b><div class="mask"><div class="track">${tick}</div></div></div></div>
<button class="up" id="up" aria-label="Back to top">${I.up}</button><div class="toast" id="toast" role="status" aria-live="polite"></div>`;

let tt;const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2400)};
const go=id=>{const el=document.getElementById(id);el&&el.scrollIntoView({behavior:'smooth',block:'start'})};
let i=0,filt=null,timer=null;
const cur=()=>filt?D.projects.filter(x=>uses(x,key(filt))):D.projects;
function draw(){const L=cur(),x=L[i%L.length];
$('#pbody').innerHTML=`<div class="pbody"><div class="t">${esc(x.project)}: ${esc(x.subject)}</div><div class="sub">${esc(x.company)} &middot; ${esc(x.duration)} &middot; team of ${esc(x.teamSize)}</div><p class="pdesc">${esc(x.description)}</p>${chips(list(x.technologies)).replace(/<li/g,'<li').replace(/(<li[^>]*>)([^<]+)/g,(m,a,b)=>filt&&key(b)===key(filt)?a.replace('<li','<li class="hit"')+b:m)}${filt?`<span class="filt">Filter: ${esc(filt)} &middot; ${i%L.length+1}/${L.length} <button data-clear aria-label="Clear filter" style="background:none;color:inherit;font-weight:800">&times;</button></span>`:`<div class="small" style="margin-top:8px">${i%L.length+1} / ${L.length}</div>`}</div>`;
$('#bar i').style.width=((i%L.length+1)/L.length*100)+'%';
const pp=$('#pp');pp.innerHTML=timer?I.pause:I.play;pp.setAttribute('aria-label',timer?'Pause auto-play':'Auto-play projects')}
function step(d,keep){const n=cur().length;i=(i%n+d+n)%n;if(!keep&&timer){clearInterval(timer);timer=null}draw()}
function setFilter(s,ns){const sk=key(s);if(filt&&key(filt)===sk){filt=null;toast('Filter cleared')}else{const n=D.projects.filter(x=>uses(x,sk)).length;if(!n){toast('No project lists '+s+' (see work profile)');return}filt=s;toast(n+(n>1?' projects use ':' project uses ')+s+(ns?' (see Projects)':''));ns||go('projects')}
i=0;document.querySelectorAll('#skills [data-skill]').forEach(b=>{const on=filt&&key(b.dataset.skill)===key(filt);b.classList.toggle('on',!!on);b.setAttribute('aria-pressed',!!on)});draw()}
document.addEventListener('click',e=>{const t=e.target.closest('button,a');if(!t)return;
if(t.classList.contains('btn')){t.classList.add('pop');setTimeout(()=>t.classList.remove('pop'),180)}
if(t.dataset.go)go(t.dataset.go);
if(t.dataset.tab!==undefined){tab=t.dataset.tab;document.querySelectorAll('.tabs button').forEach(b=>{const on=b===t;b.classList.toggle('on',on);b.setAttribute('aria-selected',on)});renderSk()}
if(t.dataset.skill)setFilter(t.dataset.skill,!!t.closest('#skills'));
if(t.hasAttribute('data-clear')){filt=null;setFilter_clear()}
if(t.dataset.copy){const v=t.dataset.copy;(navigator.clipboard?navigator.clipboard.writeText(v):Promise.reject()).then(()=>toast(t.dataset.l+' copied: '+v),()=>toast(t.dataset.l+': '+v))}
if(t.hasAttribute('data-notice'))toast('Notice period: '+p.noticePeriod);
if(t.dataset.acc){document.documentElement.style.setProperty('--acc',t.dataset.acc);document.querySelectorAll('.dots button').forEach(b=>b.classList.toggle('on',b===t));toast(t.dataset.n+' accent')}
if(t.dataset.row!==undefined){go('work');const r=document.querySelector(`[data-r="${t.dataset.row}"]`);r.classList.remove('flash');void r.offsetWidth;r.classList.add('flash')}
if(t.id==='up')scrollTo({top:0,behavior:'smooth'});
});
function setFilter_clear(){i=0;document.querySelectorAll('#skills [data-skill]').forEach(b=>{b.classList.remove('on');b.setAttribute('aria-pressed','false')});toast('Filter cleared');draw()}
$('#pv').onclick=()=>step(-1);$('#nx').onclick=()=>step(1);
$('#pp').onclick=()=>{if(timer){clearInterval(timer);timer=null}else timer=setInterval(()=>step(1,1),4500);draw()};
$('#bar').onclick=e=>{const r=e.currentTarget.getBoundingClientRect(),n=cur().length;i=Math.min(n-1,Math.floor((e.clientX-r.left)/r.width*n));draw()};
document.addEventListener('keydown',e=>{if(e.target.closest('input,textarea'))return;if(e.key==='ArrowRight')step(1);if(e.key==='ArrowLeft')step(-1)});
let tab='All';
function renderSk(){let n=0;$('#sk').innerHTML=Object.entries(sg).filter(([c])=>tab==='All'||c===tab).map(([c,l])=>{const avg=Math.round(l.reduce((a,s)=>a+(+s.level||0),0)/l.length);
return `<div class="sgrp"><div class="sh"><strong>${esc(c)}</strong><span class="sub">average ${avg}%</span></div><div class="sbs">${l.map(s=>{const k=key(s.skill),u=D.projects.filter(x=>uses(x,k)).length,on=filt&&key(filt)===k,v=+s.level||0;
return `<button class="sb${on?' on':''}" data-skill="${esc(s.skill)}" aria-pressed="${!!on}" style="--l:${v};--n:${n++}"><span class="sn">${esc(s.skill)}</span><span class="sp">${v}%</span><span class="st"><i></i></span><small>${u?`used in ${u} of ${D.projects.length} projects`:'not listed in projects'}</small></button>`}).join('')}</div></div>`}).join('')}
draw();renderSk();
const count=el=>{const to=+el.dataset.count,t0=performance.now();const f=t=>{const k=Math.min(1,(t-t0)/1100);el.textContent=Math.round(to*(1-Math.pow(1-k,3)));k<1&&requestAnimationFrame(f)};requestAnimationFrame(f)};
count(document.querySelector('.big b'));
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');const f=e.target.querySelector('.fill');if(f)f.style.height=f.dataset.h;e.target.querySelectorAll('[data-count]').forEach(count);io.unobserve(e.target)}}),{threshold:.12});
document.querySelectorAll('.reveal').forEach(el=>io.observe(el));
const secs=['top','work','projects','skills','more'];
const so=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('on',b.dataset.go===e.target.id))}),{rootMargin:'-35% 0px -55% 0px'});
secs.forEach(s=>so.observe(document.getElementById(s)));
addEventListener('scroll',()=>$('#up').classList.toggle('show',scrollY>600),{passive:true});
</script></body></html>
